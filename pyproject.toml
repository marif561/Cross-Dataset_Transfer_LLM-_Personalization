[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "userprint"
version = "1.0.0"
description = "USERPRINT: zero-shot, cluster-based persona conditioning for black-box LLM personalization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Abiola T. O." }, { name = "Muhammad Arif" }, { name = "Abiola O. J." }, { name = "Oredeko O. B." },
  { name = "Tewodros A. B." }, { name = "Ojo O. E." }, { name = "C. E. Maldonado-Sifuentes" }, { name = "Calvo H." },
]
dependencies = ["numpy", "pandas", "scikit-learn>=1.3"]

[project.optional-dependencies]
full = ["sentence-transformers>=2.2", "umap-learn>=0.5", "bert-score>=0.3.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
